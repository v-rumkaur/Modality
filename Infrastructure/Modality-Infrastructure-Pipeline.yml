trigger:
  branches:
    include:
    - main
  paths:
    include:
    - Infrastructure/*

variables:
  CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)]  # needed for onebranch.pipeline.version task https://aka.ms/obpipelines/versioning
  REPOROOT: "$(Build.SourcesDirectory)"
  OUTPUTROOT: "$(REPOROOT)/out"
  BuildConfiguration: Release
  WindowsContainerImage: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest' # for Windows jobs https://aka.ms/obpipelines/containers

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

extends:
  # TODO Update OneBranch template to official version -- using non-official for testing of local branches
  #template: v2/OneBranch.Official.CrossPlat.yml@templates  # https://aka.ms/obpipelines/templates
  template: v2/OneBranch.Official.CrossPlat.yml@templates  # https://aka.ms/obpipelines/templates
  parameters:
    featureFlags:
      WindowsHostVersion: '1ESWindows2022'
    globalSdl:  # https://aka.ms/obpipelines/sdl
      tsa:
        enabled: false  # onebranch publish all SDL results to TSA. If TSA is disabled all SDL tools will forced into 'break' build mode.
      binskim:
        break: true  # always break the build on binskim issues.
      policheck:
        break: true  # always break the build on policheck issues.
    stages:
    # Deploy infrastructure to Dev environment
    - stage: NonProd_Deploy_DEV_Infra
      displayName: "Deploy DEV Infrastructure"
      jobs:
      - job: Manual_Approval_Common
        displayName: "Approve Deployment of Common DEV Infrastructure"
        pool:
          type: agentless
        steps:
        - task: ManualValidation@1
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: chanton@microsoft.com #TODO: UPDATE TO sxgchatall@microsoft.com
            onTimeout: reject
      - job: Deploy_Infra_Common
        displayName: "Deploy Common Infrastructure"
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(OUTPUTROOT)'
        dependsOn: Manual_Approval_Common
        steps:
        - task: PowerShell@2
          displayName: 'Install Az.Accounts Module'
          inputs:
            targetType: 'inline'
            script: |
              Get-PackageProvider -Name NuGet -ForceBootstrap
              Install-Module -Name Az.Accounts -Verbose -Force -AllowClobber
              Uninstall-AzureRm -Verbose
        - task: AzurePowerShell@4
          displayName: "Run Infrastructure Deployment Script"
          inputs:
            azureSubscription: "$(ServiceConnection_DEV)"
            ScriptType: InlineScript
            Inline: |
              cd $(System.DefaultWorkingDirectory)/Infrastructure/Scripts
              ./deploy_dev.ps1
            azurePowerShellVersion: LatestVersion
            workingDirectory: "$(System.DefaultWorkingDirectory)/Infrastructure/Scripts"

      - job: Deploy_Infra_WestUS
        displayName: "Deploy West US"
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(OUTPUTROOT)'
        dependsOn: Deploy_Infra_Common
        steps:
        - task: PowerShell@2
          displayName: 'Install Az.Accounts Module'
          inputs:
            targetType: 'inline'
            script: |
              Get-PackageProvider -Name NuGet -ForceBootstrap
              Install-Module -Name Az.Accounts -Verbose -Force -AllowClobber
              Uninstall-AzureRm -Verbose
        - task: AzurePowerShell@4
          displayName: "Run Infrastructure Deployment Script"
          inputs:
            azureSubscription: "$(ServiceConnection_DEV)"
            ScriptType: InlineScript
            Inline: |
              cd $(System.DefaultWorkingDirectory)/Infrastructure/Scripts
              ./deploy_dev_region.ps1 `
              -Location                         "westus" `
              -ResourceSuffix                   "-dev-wus" `
              -RegionIPSegment                  "1"
            azurePowerShellVersion: LatestVersion
            workingDirectory: "$(System.DefaultWorkingDirectory)/Infrastructure/Scripts"

