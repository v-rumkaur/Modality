trigger:
  branches:
    include:
    - main
  paths:
    include:
    - Infrastructure/*

variables:
  CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)]  # needed for onebranch.pipeline.version task https://aka.ms/obpipelines/versioning
  REPOROOT: "$(Build.SourcesDirectory)"
  OUTPUTROOT: "$(REPOROOT)/out"
  BuildConfiguration: Release
  WindowsContainerImage: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest' # for Windows jobs https://aka.ms/obpipelines/containers

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates  # https://aka.ms/obpipelines/templates
  parameters:
    featureFlags:
      WindowsHostVersion: '1ESWindows2022'
    globalSdl:  # https://aka.ms/obpipelines/sdl
      tsa:
        enabled: false  # onebranch publish all SDL results to TSA. If TSA is disabled all SDL tools will forced into 'break' build mode.
      binskim:
        break: true  # always break the build on binskim issues.
      policheck:
        break: true  # always break the build on policheck issues.
    stages:
    # Deploy infrastructure to INT environment
    - stage: NonProd_Deploy_INT_Infra
      displayName: "Deploy INT Infrastructure"
      #dependsOn: NonProd_Deploy_DEV_Infra
      jobs:
      - job: Manual_Approval_Common
        displayName: "Approve Deployment of Common INT Infrastructure"
        pool:
          type: agentless
        steps:
        - task: ManualValidation@1
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: sxgchatall@microsoft.com
            onTimeout: reject

      - job: Deploy_Infra_Common
        displayName: "Deploy Common Infrastructure"
        dependsOn: Manual_Approval_Common
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(OUTPUTROOT)'
        steps:
        - task: PowerShell@2
          displayName: 'Install Az.Accounts Module'
          inputs:
            targetType: 'inline'
            script: |
              Install-PackageProvider -Name NuGet -Force -Confirm:$false
              Write-Host "NuGet Package Provider Installed Successfully."

              $AccessToken = "$(System.AccessToken)"
              $SecureAccessToken = ConvertTo-SecureString $AccessToken -AsPlainText -Force
              $CredentialObj = New-Object System.Management.Automation.PSCredential("AzureDevOps", $SecureAccessToken)
              Write-Host "Credential object created."

              $CentralFeedName = "ModalityCentralFeed"
              $CentralFeedLocation = "https://pkgs.dev.azure.com/dynamicscrm/OneCRM/_packaging/CRM.ICon.OneChat/nuget/v2"
        
              Write-Host "Started registering private central feed."
              if (-not (Get-PSRepository -Name $CentralFeedName -ErrorAction SilentlyContinue)) {
                Register-PSRepository -Name $CentralFeedName -SourceLocation $CentralFeedLocation -InstallationPolicy Trusted -Credential $CredentialObj
                Write-Output "Repository '$CentralFeedName' registered successfully."
              } else {
                Write-Output "Repository '$CentralFeedName' is already registered."
              }
              Get-PackageProvider -Name NuGet -ForceBootstrap
              Install-Module -Name Az.Accounts -Verbose -Force -AllowClobber -Repository $CentralFeedName -Credential $CredentialObj
              $AzureRM = Get-InstalledModule -Name AzureRM -ErrorAction SilentlyContinue
              if ($AzureRM) {
              Write-Host "AzureRM module found. Uninstalling..."
              Get-InstalledModule -Name AzureRM -AllVersions | Uninstall-Module -Force -ErrorAction SilentlyContinue
              } else {
                Write-Host "AzureRM module is not installed. Skipping uninstallation."
              }
        - task: AzurePowerShell@4
          displayName: "Run Infrastructure Deployment Script"
          inputs:
            azureSubscription: "$(ServiceConnection_INT)"
            ScriptType: InlineScript
            Inline: |
              cd $(System.DefaultWorkingDirectory)/Infrastructure/Scripts
              ./deploy_int.ps1 -AccessToken $(System.AccessToken)
            azurePowerShellVersion: LatestVersion
            workingDirectory: "$(System.DefaultWorkingDirectory)/Infrastructure/Scripts"

