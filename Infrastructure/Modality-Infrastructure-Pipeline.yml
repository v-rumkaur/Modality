              }
        - task: AzurePowerShell@4
          displayName: "Run Infrastructure Deployment Script"
          inputs:
            azureSubscription: "$(ServiceConnection_INT)"
            ScriptType: InlineScript
            Inline: |
              cd $(System.DefaultWorkingDirectory)/Infrastructure/Scripts
              ./deploy_int_region.ps1 `
              -Location                         "westus" `
              -ResourceSuffix                   "-int-wus" `
              -RegionIPSegment                  "1" `
              -AccessToken $(System.AccessToken)
            azurePowerShellVersion: LatestVersion
