    # Deploy infrastructure to PPE environment
    - stage: NonProd_Deploy_PPE_Infra
      displayName: "Deploy PPE Infrastructure"
      jobs:
      - job: Deploy_Infra_Common
        displayName: "Deploy Common Infrastructure"
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(OUTPUTROOT)'
        steps:
        - task: PowerShell@2
          displayName: 'Install Az.Accounts Module'
          inputs:
            targetType: 'inline'
            script: |
              Get-PackageProvider -Name NuGet -ForceBootstrap
              Install-Module -Name Az.Accounts -Verbose -Force -AllowClobber
              Uninstall-AzureRm -Verbose
        - task: AzurePowerShell@4
          displayName: "Run Infrastructure Deployment Script"
          inputs:
            azureSubscription: "$(ServiceConnection_Dev)"
            ScriptType: InlineScript
            Inline: |
              cd $(System.DefaultWorkingDirectory)/Infrastructure/Scripts
              ./deploy_ppe.ps1
            azurePowerShellVersion: LatestVersion
            workingDirectory: "$(System.DefaultWorkingDirectory)/Infrastructure/Scripts"

      - job: Deploy_Infra_WestUS
        displayName: "Deploy West US"
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(OUTPUTROOT)'
        dependsOn: Deploy_Infra_Common
        steps:
        - task: PowerShell@2
          displayName: 'Install Az.Accounts Module'
          inputs:
            targetType: 'inline'
            script: |
              Get-PackageProvider -Name NuGet -ForceBootstrap
              Install-Module -Name Az.Accounts -Verbose -Force -AllowClobber
              Uninstall-AzureRm -Verbose
        - task: AzurePowerShell@4
          displayName: "Run Infrastructure Deployment Script"
          inputs:
            azureSubscription: "$(ServiceConnection_Dev)"
            ScriptType: InlineScript
            Inline: |
              cd $(System.DefaultWorkingDirectory)/Infrastructure/Scripts
              ./deploy_ppe_region.ps1 `
              -Location                         "westus" `
              -ResourceSuffix                   "-ppe-wus" `
              -RegionIPSegment                  "1"
            azurePowerShellVersion: LatestVersion
            workingDirectory: "$(System.DefaultWorkingDirectory)/Infrastructure/Scripts"

      - job: Deploy_Infra_EastUS
        displayName: "Deploy East US"
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(OUTPUTROOT)'
        dependsOn: Deploy_Infra_Common
        steps:
        - task: PowerShell@2
          displayName: 'Install Az.Accounts Module'
          inputs:
            targetType: 'inline'
            script: |
              Get-PackageProvider -Name NuGet -ForceBootstrap
              Install-Module -Name Az.Accounts -Verbose -Force -AllowClobber
              Uninstall-AzureRm -Verbose
        - task: AzurePowerShell@4
          displayName: "Run Infrastructure Deployment Script"
          inputs:
            azureSubscription: "$(ServiceConnection_Dev)"
            ScriptType: InlineScript
            Inline: |
              cd $(System.DefaultWorkingDirectory)/Infrastructure/Scripts
              ./deploy_ppe_region.ps1 `
              -Location                         "eastus" `
              -ResourceSuffix                   "-ppe-eus" `
              -RegionIPSegment                  "2"
            azurePowerShellVersion: LatestVersion
            workingDirectory: "$(System.DefaultWorkingDirectory)/Infrastructure/Scripts"

      - job: Deploy_Infra_WestEurope
        displayName: "Deploy West Europe"
        pool:
          type: windows
        variables:
