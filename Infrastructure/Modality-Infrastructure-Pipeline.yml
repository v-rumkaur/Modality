              Get-PackageProvider -Name NuGet -ForceBootstrap
              Install-Module -Name Az.Accounts -Verbose -Force -AllowClobber
              Uninstall-AzureRm -Verbose
        - task: AzurePowerShell@4
          displayName: "Run Infrastructure Deployment Script"
          inputs:
